<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrays and Functions</title>
  <style>
    body { font-family: Consolas, "Courier New", monospace; background: #102027; color: #e0f2f1; margin: 0; padding: 30px 6%; }
    h1 { font-family: "Segoe UI", sans-serif; color: #80cbc4; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    select, button { font: inherit; padding: 8px 12px; border: 1px solid #4f6d7a; background: #1c313a; color: #e0f2f1; }
    button { cursor: pointer; }
    button:hover { background: #26424d; }
    pre { background: #000a0f; border-left: 4px solid #80cbc4; padding: 16px; white-space: pre-wrap; min-height: 120px; }
  </style>
</head>
<body>
  <h1>JavaScript Arrays and Functions</h1>
  <div class="controls">
    <select id="program"></select>
    <button id="runAll">Run all programs</button>
  </div>
  <pre id="result"></pre>
  <script src="arrays-functions.js"></script>
</body>
</html>
